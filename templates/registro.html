{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<h1>Crea tu cuenta</h1>
<p class="sub">Tardas menos de un minuto.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label for="nombre">Nombre</label>
  <input id="nombre" name="nombre" type="text" autocomplete="name" required autofocus>
  <label for="departamento">Departamento</label>
  <select id="departamento" name="departamento" required>
    <option value="" disabled selected>Elige tu departamento</option>
    {% for d in departamentos %}<option>{{ d }}</option>{% endfor %}
  </select>
  <small>Los equipos de IT y Ciberseguridad los asigna un administrador.</small>
  <label for="email">Correo electrónico</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <small>Mínimo 8 caracteres.</small>
  <button type="submit">Crear cuenta</button>
</form>
<p class="alterno">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
{% endblock %}
